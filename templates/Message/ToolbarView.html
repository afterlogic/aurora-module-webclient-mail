<div class="toolbar">
	<span class="content">
		<!-- ko if: Settings.layoutMode() === Enums.LayoutMode.Separated -->
			<span class="item back" data-test-id="mail-message-back" data-bind="command: backCommand, customTooltip: 'COREWEBCLIENT/ACTION_BACK'">
				<span class="icon"></span>
				<span class="text" data-bind="i18n: {'key': 'COREWEBCLIENT/ACTION_BACK'}"></span>
			</span>
		<!-- /ko -->
		<span class="item delete" data-test-id="mail-action-delete" data-bind="command: deleteCommand, visible: bNewTab, customTooltip: 'COREWEBCLIENT/ACTION_DELETE'">
			<span class="icon"></span>
			<span class="text" data-bind="i18n: {'key': 'COREWEBCLIENT/ACTION_DELETE'}"></span>
		</span>
		<span class="item prev" data-test-id="mail-message-prev" data-bind="command: prevMessageCommand, visible: bNewTab">
			<span class="icon" data-bind="customTooltip: '%MODULENAME%/ACTION_OPEN_PREV_MESSAGE'"></span>
			<span class="text" data-bind="i18n: {'key': '%MODULENAME%/ACTION_OPEN_PREV_MESSAGE'}"></span>
		</span>
		<span class="item next" data-test-id="mail-message-next" data-bind="command: nextMessageCommand, visible: bNewTab">
			<span class="text" data-bind="i18n: {'key': '%MODULENAME%/ACTION_OPEN_NEXT_MESSAGE'}"></span>
			<span class="icon" data-bind="customTooltip: '%MODULENAME%/ACTION_OPEN_NEXT_MESSAGE'"></span>
		</span>

		<!-- ko template: {name: '%ModuleName%_Message_ReplyButtonsView'} --><!-- /ko -->

		<span class="item resend" data-test-id="mail-action-resend" data-bind="command: resendCommand, visible: isVisibleResendTool">
			<span class="icon" data-bind="customTooltip: '%MODULENAME%/ACTION_RESEND'"></span>
			<span class="text" data-bind="i18n: {'key': '%MODULENAME%/ACTION_RESEND'}"></span>
		</span>

		<!-- ko template: {name: '%ModuleName%_Message_ForwardButtonView'} --><!-- /ko -->

		<!-- ko foreach: messageToolbarControllers -->
			<!-- ko template: { name: $data.ViewTemplate, data: $data} --><!-- /ko -->
		<!-- /ko -->

		<a class="item new_window" href="javascript: void(0);" data-test-id="mail-open-new-window"
			data-bind="click: openInNewWindow, visible: !bNewTab">
			<span class="icon" data-bind="customTooltip: '%MODULENAME%/ACTION_OPEN_IN_NEW_WINDOW'"></span>
			<span class="text" data-bind="i18n: {'key': '%MODULENAME%/ACTION_OPEN_IN_NEW_WINDOW'}"></span>
		</a>

		<span class="item more" data-test-id="mail-message-more" data-bind="dropdown: {control: false, parent: '.message_viewer'}, command: moreCommand, customTooltip: '%MODULENAME%/ACTION_SHOW_MORE_ACTIONS'">
			<span class="icon"></span>
			<span class="text" data-bind="i18n: {'key': '%MODULENAME%/ACTION_SHOW_MORE_ACTIONS'}"></span>
			<span class="dropdown">
				<span class="dropdown_helper">
					<span class="dropdown_arrow">
						<span></span>
					</span>
					<span class="dropdown_content">
						<span class="item print" data-bind="command: printCommand">
							<span class="icon"></span>
							<span class="text" data-bind="i18n: {'key': '%MODULENAME%/ACTION_PRINT'}"></span>
						</span>

						<span class="item save" data-test-id="mail-menu-download-eml" data-bind="command: saveCommand">
							<span class="icon"></span>
							<span class="text" data-bind="i18n: {'key': '%MODULENAME%/ACTION_DOWNLOAD_EML'}"></span>
						</span>

						<span class="item forward" data-test-id="mail-menu-forwardAsAttachment" data-bind="command: forwardAsAttachment, visible: isVisibleForwardTool">
							<span class="icon"></span>
							<span class="text" data-bind="i18n: {'key': '%MODULENAME%/ACTION_FORWARD_AS_ATTACHMENT'}"></span>
						</span>

						<span class="item headers" data-test-id="mail-menu-viewHeaders" data-bind="visible: currentMessage() && currentMessage().completelyFilled(), click: showSourceHeaders">
							<span class="icon"></span>
							<span class="text" data-bind="i18n: {'key': '%MODULENAME%/ACTION_OPEN_MESSAGE_HEADERS'}"></span>
						</span>
						
						<!-- ko template: { name: oUnsubscribeButtonView.ViewTemplate, data: oUnsubscribeButtonView} --><!-- /ko -->

						<!-- ko foreach: moreSectionCommands -->
						<span class="item" data-bind="command: Command, css: CssClass, visible: Visible">
							<span class="icon"></span>
							<span class="text" data-bind="text: Text"></span>
						</span>
						<!-- /ko -->

					</span>
				</span>
			</span>
		</span>

	</span>
</div>
